<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1720" />
  <title>Merci — AJG Voyage</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="success-main">
    <section class="success-card">
      <div class="success-icon">✓</div>
      <span class="eyebrow dark">Demande enregistrée</span>
      <h1>Merci, votre demande est bien partie.</h1>
      <p>La prochaine étape sera de réserver un créneau pour la présentation. Le calendrier personnel sera connecté ici avant la mise en ligne publique.</p>
      <div class="success-actions">
        <button class="button button-primary" type="button" id="booking-placeholder">Réserver ma présentation →</button>
        <a class="button button-secondary" href="/">Revenir à l’accueil</a>
      </div>
      <p class="success-note">Prototype V1 : le lien Cal.com reste à connecter.</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/success.js" defer></script>
</body>
</html>
