name: ELTARA Uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check application and database health
        run: |
          HTTP_CODE="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 5 --max-time 15 --max-filesize 16384 \
            --output /tmp/eltara-uptime-app.json --write-out '%{http_code}' \
            https://ajg-site-builder.vercel.app/api/health)"
          node site-builder/scripts/verify-uptime-health.mjs /tmp/eltara-uptime-app.json "$HTTP_CODE"

      - name: Check ELTARA public domain
        run: |
          if ! getent hosts eltara.ajgsolutionsgroup.com > /tmp/eltara-hosts.txt 2>/dev/null; then
            echo "::error::eltara.ajgsolutionsgroup.com is not resolvable."
            exit 1
          fi
          HTTP_CODE="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 5 --max-time 15 --max-filesize 16384 \
            --output /tmp/eltara-uptime-public.json --write-out '%{http_code}' \
            https://eltara.ajgsolutionsgroup.com/api/health)"
          node site-builder/scripts/verify-uptime-health.mjs /tmp/eltara-uptime-public.json "$HTTP_CODE"

      - name: Check ELTARA published canary site
        continue-on-error: true
        run: |
          if ! getent hosts test-julien.eltara.ajgsolutionsgroup.com > /tmp/eltara-canary-hosts.txt 2>/dev/null; then
            echo "::warning::ELTARA branded canary DNS is not ready yet."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://test-julien.eltara.ajgsolutionsgroup.com/ > /dev/null || {
              echo "::warning::ELTARA branded canary HTTPS is not ready yet."
              exit 0
            }

      - name: Check legacy published canary site
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://test-julien.voyage.ajgsolutionsgroup.com/ > /dev/null
