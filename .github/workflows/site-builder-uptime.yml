name: ELTARA Uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check application and database health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://ajg-site-builder.vercel.app/api/health

      - name: Check ELTARA public domain
        continue-on-error: true
        run: |
          if ! getent hosts eltara.ajgsolutionsgroup.com > /tmp/eltara-hosts.txt 2>/dev/null; then
            echo "::warning::eltara.ajgsolutionsgroup.com is not resolvable yet. Core ELTARA production remains healthy on the managed Vercel alias."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://eltara.ajgsolutionsgroup.com/api/health > /dev/null || {
              echo "::warning::ELTARA public domain resolves but HTTPS/health is not ready."
              exit 0
            }

      - name: Check ELTARA published canary site
        continue-on-error: true
        run: |
          if ! getent hosts test-julien.eltara.ajgsolutionsgroup.com > /tmp/eltara-canary-hosts.txt 2>/dev/null; then
            echo "::warning::ELTARA branded canary DNS is not ready yet."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://test-julien.eltara.ajgsolutionsgroup.com/ > /dev/null || {
              echo "::warning::ELTARA branded canary HTTPS is not ready yet."
              exit 0
            }

      - name: Check legacy published canary site
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://test-julien.voyage.ajgsolutionsgroup.com/ > /dev/null
