name: AJG Site Builder Uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check application and database health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5             https://ajg-site-builder.vercel.app/api/health

      - name: Check published canary site
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5             https://test-julien.voyage.ajgsolutionsgroup.com/ > /dev/null
