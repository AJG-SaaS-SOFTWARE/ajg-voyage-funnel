name: AJG Corrective Diagnostics

on:
  repository_dispatch:
    types: [ajg-corrective-agent]

permissions:
  contents: read
  issues: write

concurrency:
  group: ajg-corrective-diagnostic-${{ github.event.client_payload.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.client_payload.mode == 'diagnose'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-builder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck diagnostic
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Run test diagnostic
        id: tests
        continue-on-error: true
        run: npm test

      - name: Report verdict to issue
        if: always() && github.event.client_payload.issue_number != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.client_payload.issue_number }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          ATTEMPT_ID: ${{ github.event.client_payload.attempt_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$ATTEMPT_ID" ]; then
            PREFIX="<!-- ajg-corrective-result:v2 attempt=$ATTEMPT_ID"
          else
            PREFIX="<!-- ajg-corrective-result:v1"
          fi
          if [ "$TYPECHECK" = "success" ] && [ "$TESTS" = "success" ]; then
            MARKER="$PREFIX status=passed mode=diagnose -->"
            VERDICT="✅ Diagnostic correctif automatique : contrôles ELTARA au vert."
          else
            MARKER="$PREFIX status=failed mode=diagnose -->"
            VERDICT="⚠️ Diagnostic correctif automatique : au moins un contrôle ELTARA a échoué."
          fi
          DIAGNOSTIC="<!-- ajg-corrective-diagnostic:v1 typecheck=$TYPECHECK lint=na tests=$TESTS -->"
          gh issue comment "$ISSUE" --body "$MARKER
          $DIAGNOSTIC
          $VERDICT

          Mode: diagnostic uniquement — aucun code, secret, donnée ou déploiement n'a été modifié.
          Exécution: $RUN_URL"
