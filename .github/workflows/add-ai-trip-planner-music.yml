name: Add AI Trip Planner background music

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-ai-trip-planner-music.yml"

permissions:
  contents: write

jobs:
  mix-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Retrieve the selected Vastness track
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet yt-dlp
          python3 -m yt_dlp \
            --no-playlist \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --output "/tmp/vastness.%(ext)s" \
            "https://soundcloud.com/tamaz-diakonidze/mixkit-vastness-184"

          test -f /tmp/vastness.mp3

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/vastness.mp3)"
          python3 - "$DURATION" <<'PY'
          import sys
          duration=float(sys.argv[1])
          expected=229.851429
          if abs(duration-expected) > 1.0:
              raise SystemExit(f"Unexpected Vastness duration: {duration:.3f}s")
          PY

          ACTUAL_FP="$(ffmpeg -v error -i /tmp/vastness.mp3 -t 30 -f chromaprint -fp_format 2 - 2>/dev/null)"
          EXPECTED_FP="AQAA3UqkPEqSJMZf9HBf7Dc-XmjyE1VyIswvHHpD_Eef6GigWkGcHG18eAwr4_iHF30qHHG2BTqaJUe-K4F_DfWWIP_RHlqiHhFTpsMF4_sxlP8QKV1oqIwGLnoQ5piO-3h05Fqg5kfs40GPxxrs4-iTGUnoBXF-MEW7fLhfXFHQD950XEf6QIpyfC3y4gKP-oHdR_hYOMmR5iX6G_pxPOGJPtByPBXi40eZjBU2P3hGXEV_PCZiE3qOZroS5PnwTXhW5DnKB2p8xC6mYPqJH_9RL3oQKb6hcke26GiO6Tuu4xliL5B_xH5woj3uwj5-IpJOqHmK_KCPB8_K4kGfD25i40IYHtLyIX5wGj_4oDcezca4_HjOIkyO37gPHeeJD1ouVHkQC384lMxX_PA99BfOoTODNA2hI8yC88E3Ufga5EFFJEvy4GE39GhwovmPNneQ5LWRLXuIJnixoxby7FDTRUJs0cODo69wmMpRfYjaKIV6ZD_aKDl6hscX_OgTHa6MIww7qDmyPcVxgjnMpDO-Uxj3I05OFj1-6Mdj1OIJP9A-YsyPWEe7LMfMyzgH9xP6BMezEcAEJgQhYIgCEhkEnECSMKWsAMgKAoQQhBnIAABGIIKMIgYwRaaBcDgjEEEWEYEIUFwygoQTCiqEEDEAEsFAIgAAYpBBVEBHjGGMOCAQEYgYhBBgihOkoAKCeMiYFAQKYphBGiJAhABNIWUYQgAYQJhSQgBCDCICMkOIAIIAJw4hRyErSFJGEIcUIFQZxjEiQghBnUQICQGAFEYDAAA"
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "Downloaded audio fingerprint does not match the user-supplied Vastness file."
            exit 1
          fi

      - name: Preserve original video stream and add music
        shell: bash
        run: |
          set -euo pipefail

          INPUT="assets/ai-trip-planner-demo.mp4"
          OUTPUT="/tmp/ai-trip-planner-demo-with-music.mp4"

          ORIGINAL_VIDEO_HASH="$(ffmpeg -v error -i "$INPUT" -map 0:v:0 -c:v copy -f hash -hash sha256 - 2>/dev/null | tr -d '\r')"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$INPUT")"
          FADE_START="$(awk -v d="$DURATION" 'BEGIN { s=d-2; if (s<0) s=0; printf "%.3f", s }')"

          ffmpeg -y \
            -i "$INPUT" \
            -i /tmp/vastness.mp3 \
            -filter_complex "[1:a]volume=0.09,afade=t=in:st=0:d=1.5,afade=t=out:st=${FADE_START}:d=2[a]" \
            -map 0:v:0 \
            -map "[a]" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            "$OUTPUT"

          NEW_VIDEO_HASH="$(ffmpeg -v error -i "$OUTPUT" -map 0:v:0 -c:v copy -f hash -hash sha256 - 2>/dev/null | tr -d '\r')"

          echo "Original video stream: $ORIGINAL_VIDEO_HASH"
          echo "New video stream:      $NEW_VIDEO_HASH"

          test "$ORIGINAL_VIDEO_HASH" = "$NEW_VIDEO_HASH"

          mv "$OUTPUT" "$INPUT"

          ffprobe -v error \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of json "$INPUT"

      - name: Enable audio on French and English pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in ("index.html", "en/index.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              old = "<video controls muted playsinline preload=\"metadata\""
              new = "<video controls playsinline preload=\"metadata\""
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{filename}: expected exactly one muted AI Trip Planner video, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit mixed video and page updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "AJG Voyage Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/ai-trip-planner-demo.mp4 index.html en/index.html
          git commit -m "Add Vastness music to AI Trip Planner demo"
          git push origin main
