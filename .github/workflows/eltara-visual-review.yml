name: ELTARA Visual Review

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ELTARA Production Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: eltara-visual-review
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://eltara.ajgsolutionsgroup.com
      PLAYWRIGHT_VERSION: 1.55.0
      REVIEW_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SURFACE_SET_VERSION: customer-core-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install Chromium for deterministic visual capture
        run: npx --yes playwright@${PLAYWRIGHT_VERSION} install --with-deps chromium

      - name: Capture FR and EN desktop/mobile surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/eltara-visual-review

          capture() {
            local locale="$1"
            local viewport="$2"
            local suffix="$3"
            local path="$4"
            local slug="$5"

            curl --fail --silent --show-error --location --max-time 15 "${BASE_URL}${path}" --output /dev/null
            npx --yes playwright@${PLAYWRIGHT_VERSION} screenshot               --browser chromium               --lang "$locale"               --viewport-size "$viewport"               --full-page               --wait-for-timeout 1200               "${BASE_URL}${path}"               "artifacts/eltara-visual-review/${slug}-${suffix}.png"
          }

          for surface in             "home:/"             "login:/login"; do
            slug="${surface%%:*}"
            path="${surface#*:}"
            capture "fr-FR" "1440,1000" "fr-desktop" "$path" "$slug"
            capture "fr-FR" "390,844" "fr-mobile" "$path" "$slug"
            capture "en-US" "1440,1000" "en-desktop" "$path" "$slug"
            capture "en-US" "390,844" "en-mobile" "$path" "$slug"
          done

          for surface in             "legal-fr:/mentions-legales"             "privacy-fr:/confidentialite"             "terms-fr:/cgv"             "cancel-fr:/resilier"             "legal-en:/legal"             "privacy-en:/privacy"             "terms-en:/terms"             "cancel-en:/cancel"; do
            slug="${surface%%:*}"
            path="${surface#*:}"
            capture "fr-FR" "1440,1000" "desktop" "$path" "$slug"
            capture "fr-FR" "390,844" "mobile" "$path" "$slug"
          done

          count="$(find artifacts/eltara-visual-review -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$count" = "24"

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");

          const directory = "artifacts/eltara-visual-review";
          const files = fs.readdirSync(directory)
            .filter((name) => name.endsWith(".png"))
            .sort()
            .map((name) => {
              const bytes = fs.readFileSync(path.join(directory, name));
              return {
                name,
                bytes: bytes.length,
                sha256: crypto.createHash("sha256").update(bytes).digest("hex")
              };
            });

          if (files.length !== 24) {
            throw new Error(`Expected 24 screenshots, got ${files.length}`);
          }

          fs.writeFileSync(
            path.join(directory, "manifest.json"),
            JSON.stringify({
              product: "ELTARA",
              deploymentSha: process.env.REVIEW_SHA,
              surfaceSetVersion: process.env.SURFACE_SET_VERSION,
              baseUrl: process.env.BASE_URL,
              capturedAt: new Date().toISOString(),
              screenshotCount: files.length,
              files
            }, null, 2) + "\n"
          );
          NODE

          sha256sum artifacts/eltara-visual-review/*.png > artifacts/eltara-visual-review/SHA256SUMS
          echo "Captured $count ELTARA FR/EN desktop/mobile screenshots with auditable SHA-256 evidence." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual review evidence
        uses: actions/upload-artifact@v4
        with:
          name: eltara-visual-review-${{ github.event.workflow_run.head_sha || github.sha }}
          path: artifacts/eltara-visual-review
          if-no-files-found: error
          retention-days: 14
