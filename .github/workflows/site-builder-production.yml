name: Site Builder Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/site-builder-production

permissions:
  contents: read

concurrency:
  group: ajg-site-builder-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/site-builder-production'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-builder
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_T1xBMzY6HJCAkUStrmkUgj60
      VERCEL_PROJECT_ID: prj_RUtVL1fXzOqY8dHetb6U2dp07Ygn
      PRODUCTION_ALIAS: ajg-site-builder.vercel.app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::GitHub secret VERCEL_TOKEN is required for controlled production releases."
            exit 1
          fi

      - name: Validate and protect Builder Vercel project
        shell: bash
        run: |
          PROJECT_URL="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"

          curl --fail --silent --show-error \
            "$PROJECT_URL" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json" > /tmp/vercel-project.json

          PROJECT_NAME="$(node -e 'const x=require("/tmp/vercel-project.json");process.stdout.write(String(x.name||""))')"
          ROOT_DIRECTORY="$(node -e 'const x=require("/tmp/vercel-project.json");process.stdout.write(String(x.rootDirectory||""))')"

          if [ "$PROJECT_NAME" != "ajg-site-builder" ]; then
            echo "::error::Unexpected Vercel project identity: $PROJECT_NAME"
            exit 1
          fi

          if [ "$ROOT_DIRECTORY" != "site-builder" ]; then
            echo "::warning::Builder rootDirectory drift detected: '${ROOT_DIRECTORY:-<root>}'. Restoring 'site-builder'."

            HTTP_CODE="$(curl --silent --show-error \
              --output /tmp/vercel-project-update.json \
              --write-out "%{http_code}" \
              --request PATCH \
              "$PROJECT_URL" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"rootDirectory":"site-builder"}')"

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Unable to restore the AJG Site Builder Vercel rootDirectory (HTTP $HTTP_CODE)."
              cat /tmp/vercel-project-update.json
              exit 1
            fi

            curl --fail --silent --show-error \
              "$PROJECT_URL" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Accept: application/json" > /tmp/vercel-project.json

            ROOT_DIRECTORY="$(node -e 'const x=require("/tmp/vercel-project.json");process.stdout.write(String(x.rootDirectory||""))')"
          fi

          if [ "$ROOT_DIRECTORY" != "site-builder" ]; then
            echo "::error::AJG Site Builder Vercel rootDirectory is '$ROOT_DIRECTORY', expected 'site-builder'."
            exit 1
          fi

          echo "Vercel project identity and rootDirectory validated: ajg-site-builder / site-builder." >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure production cron secret
        shell: bash
        run: |
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=false&teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json")"

          HAS_CRON_SECRET="$(printf '%s' "$RESPONSE" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const payload=JSON.parse(s);
              const rows=Array.isArray(payload)?payload:(payload.envs||payload.data||[]);
              const found=rows.some(item=>item?.key==="CRON_SECRET" && Array.isArray(item.target) && item.target.includes("production"));
              process.stdout.write(found?"1":"0");
            });
          ')"

          if [ "$HAS_CRON_SECRET" = "1" ]; then
            echo "Production CRON_SECRET already exists; no rotation performed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE' > /tmp/vercel-cron-secret.json
          const crypto = require("node:crypto");
          const payload = [{
            key: "CRON_SECRET",
            value: crypto.randomBytes(32).toString("base64url"),
            type: "sensitive",
            target: ["production"],
            comment: "AJG Site Builder scheduled job authorization"
          }];
          process.stdout.write(JSON.stringify(payload));
          NODE

          HTTP_CODE="$(curl --silent --show-error \
            --output /tmp/vercel-cron-secret-response.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vercel-cron-secret.json)"

          rm -f /tmp/vercel-cron-secret.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Unable to create CRON_SECRET (HTTP $HTTP_CODE)."
            cat /tmp/vercel-cron-secret-response.json
            exit 1
          fi

          rm -f /tmp/vercel-cron-secret-response.json
          echo "Production CRON_SECRET created as a sensitive Vercel variable." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Vercel production environment keys
        shell: bash
        run: |
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=false&teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json")"

          printf '%s' "$RESPONSE" > /tmp/vercel-production-envs.json
          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/vercel-production-envs.json", "utf8"));
          const rows = Array.isArray(payload) ? payload : (payload.envs || payload.data || []);
          const productionKeys = new Set(
            rows
              .filter((item) => Array.isArray(item.target) && item.target.includes("production"))
              .map((item) => item.key)
          );

          const hasAny = (...keys) => keys.some((key) => productionKeys.has(key));
          const blockers = [];
          const warnings = [];

          if (!productionKeys.has("NEXT_PUBLIC_SUPABASE_URL")) blockers.push("NEXT_PUBLIC_SUPABASE_URL");
          if (!hasAny("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY", "NEXT_PUBLIC_SUPABASE_ANON_KEY")) {
            blockers.push("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (ou NEXT_PUBLIC_SUPABASE_ANON_KEY)");
          }
          if (!hasAny("SUPABASE_SECRET_KEY", "SUPABASE_SERVICE_ROLE_KEY")) {
            blockers.push("SUPABASE_SECRET_KEY (ou SUPABASE_SERVICE_ROLE_KEY)");
          }
          if (!productionKeys.has("OPENAI_API_KEY")) blockers.push("OPENAI_API_KEY");
          if (!productionKeys.has("NEXT_PUBLIC_PUBLISHED_ROOT_DOMAIN")) {
            blockers.push("NEXT_PUBLIC_PUBLISHED_ROOT_DOMAIN");
          }

          for (const key of [
            "RESEND_API_KEY",
            "RESEND_FROM_EMAIL",
            "CRON_SECRET",
            "VERCEL_TOKEN",
            "VERCEL_PROJECT_ID",
            "VERCEL_TEAM_ID"
          ]) {
            if (!productionKeys.has(key)) warnings.push(key);
          }

          console.log("Production environment preflight:");
          console.log("  blockers:", blockers.length ? blockers.join(", ") : "none");
          console.log("  warnings:", warnings.length ? warnings.join(", ") : "none");
          console.log("  BILLING_PROVIDER_WEBHOOK_SECRET: deferred until commercial activation");

          if (blockers.length) {
            console.error("Missing blocking Vercel Production environment keys: " + blockers.join(", "));
            process.exit(1);
          }
          NODE

          echo "Vercel Production environment blockers are configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Require release branch to match main
        if: github.ref == 'refs/heads/release/site-builder-production'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Release branch must point to the current main commit."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-builder/package-lock.json

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Run recovery archive tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate private reporting token before publication
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          CONFIG_FILE="$RUNNER_TEMP/builder-reporting-production.env"
          trap 'rm -f "$CONFIG_FILE"' EXIT
          if ! npx --yes vercel@59.19.1 env pull "$CONFIG_FILE" \
            --environment=production --yes --token "$VERCEL_TOKEN" > /dev/null 2>&1; then
            echo "::error::Unable to validate private reporting configuration; publication blocked."
            exit 1
          fi
          node scripts/verify-reporting-config.mjs "$CONFIG_FILE" /tmp/vercel-production-envs.json

      - name: Capture current production rollback target
        id: previous
        shell: bash
        run: |
          RESPONSE="$(curl --fail --silent --show-error "https://api.vercel.com/v4/aliases/$PRODUCTION_ALIAS?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Accept: application/json")"
          PREVIOUS_ID="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);if(typeof x.deploymentId!=="string"||!x.deploymentId.startsWith("dpl_"))process.exit(2);process.stdout.write(x.deploymentId)})')"
          if [ -z "$PREVIOUS_ID" ]; then
            echo "::error::Unable to resolve the deployment currently serving $PRODUCTION_ALIAS."
            exit 1
          fi
          echo "deployment_id=$PREVIOUS_ID" >> "$GITHUB_OUTPUT"
          echo "Rollback target captured: $PREVIOUS_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy and explicitly promote tested Builder artifact
        id: release
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          RELEASE_BUNDLE="$RUNNER_TEMP/ajg-site-builder-release"
          rm -rf "$RELEASE_BUNDLE"
          mkdir -p "$RELEASE_BUNDLE/site-builder"

          rsync -a \
            --exclude node_modules \
            --exclude .next \
            --exclude .vercel \
            "$GITHUB_WORKSPACE/site-builder/" \
            "$RELEASE_BUNDLE/site-builder/"

          test -f "$RELEASE_BUNDLE/site-builder/package.json" || {
            echo "::error::Isolated Builder release bundle is missing package.json."
            exit 1
          }

          set +e
          npx --yes vercel@59.19.1 deploy \
            --cwd "$RELEASE_BUNDLE" \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            --project "$VERCEL_PROJECT_ID" \
            --env "AJG_RELEASE_SHA=$GITHUB_SHA" \
            2>&1 | tee /tmp/vercel-deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            echo "::error::Vercel CLI production deployment failed."
            exit "$DEPLOY_EXIT"
          fi

          DEPLOYMENT_HOST="$(
            grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/vercel-deploy.log \
              | sed 's#https://##' \
              | tail -n 1
          )"

          if [ -z "$DEPLOYMENT_HOST" ]; then
            echo "::error::Unable to extract the Vercel deployment URL from CLI output."
            exit 1
          fi

          DETAILS="$(curl --fail-with-body --silent --show-error \
            "https://api.vercel.com/v13/deployments/$DEPLOYMENT_HOST?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json")"

          DEPLOYMENT_ID="$(printf '%s' "$DETAILS" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);if(typeof x.id!=="string"||!x.id.startsWith("dpl_")){console.error(s);process.exit(2)}process.stdout.write(x.id)})')"

          node -e '
            const payload = JSON.parse(process.argv[1]);
            const state = payload?.readyState || payload?.status || "";
            if (state !== "READY") {
              console.error("CLI deployment is not READY:", state);
              process.exit(1);
            }
            if (payload?.target !== "production") {
              console.error("CLI deployment did not target production:", payload?.target);
              process.exit(1);
            }
          ' "$DETAILS"

          if [ "$DEPLOYMENT_ID" = "${{ steps.previous.outputs.deployment_id }}" ]; then
            echo "::error::Vercel returned the existing production deployment instead of a new artifact."
            exit 1
          fi

          PROMOTE_CODE="$(curl --silent --show-error \
            --output /tmp/vercel-promote.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json")"

          if [ "$PROMOTE_CODE" -eq 409 ]; then
            echo "Vercel promotion returned HTTP 409; validating whether the artifact is already current production."
          elif [ "$PROMOTE_CODE" -lt 200 ] || [ "$PROMOTE_CODE" -ge 300 ]; then
            echo "::error::Vercel promotion failed (HTTP $PROMOTE_CODE)."
            cat /tmp/vercel-promote.json
            exit 1
          fi

          PROMOTED=0
          for attempt in $(seq 1 18); do
            RESPONSE="$(curl --fail-with-body --silent --show-error \
              "https://api.vercel.com/v4/aliases/$PRODUCTION_ALIAS?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Accept: application/json")"
            ALIAS_DEPLOYMENT_ID="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);process.stdout.write(typeof x.deploymentId==="string"?x.deploymentId:"")})')"
            if [ "$ALIAS_DEPLOYMENT_ID" = "$DEPLOYMENT_ID" ]; then
              PROMOTED=1
              break
            fi
            echo "Waiting for production alias promotion ($attempt/18)..."
            sleep 5
          done

          if [ "$PROMOTED" -ne 1 ]; then
            echo "::error::Production alias did not move to $DEPLOYMENT_ID after explicit promotion."
            exit 1
          fi

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "url=https://$DEPLOYMENT_HOST" >> "$GITHUB_OUTPUT"
          echo "Vercel artifact $DEPLOYMENT_ID explicitly promoted to $PRODUCTION_ALIAS." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live production or rollback
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          for attempt in $(seq 1 8); do
            if npm run verify:deployment -- --url="https://$PRODUCTION_ALIAS" --sha="$GITHUB_SHA"; then
              echo "Production release verified at commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Production verification attempt $attempt/8 did not pass yet."
            sleep 5
          done

          echo "::error::Production revision/health verification failed after promotion. Rolling back to $PREVIOUS_DEPLOYMENT_ID."
          curl --fail-with-body --silent --show-error --request POST \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$PREVIOUS_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json"
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "https://$PRODUCTION_ALIAS/login" > /dev/null
          echo "Rollback requested to $PREVIOUS_DEPLOYMENT_ID after failed production revision/health verification." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify managed-domain HTTPS canary when available
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.release.outputs.deployment_id }}
        run: |
          RESPONSE="$(curl --fail-with-body --silent --show-error             "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID"             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Accept: application/json")"

          CANARY="$(printf '%s' "$RESPONSE" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const x=JSON.parse(s);
              const aliases=Array.isArray(x.alias)?x.alias:[];
              const match=aliases.find(v=>typeof v==="string" && v.endsWith(".voyage.ajgsolutionsgroup.com") && v!=="voyage.ajgsolutionsgroup.com");
              if(match) process.stdout.write(match);
            });
          ')"

          if [ -z "$CANARY" ]; then
            echo "No managed-domain canary attached to this deployment; HTTPS canary check skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors             "https://$CANARY/" > /dev/null
          echo "Managed-domain HTTPS canary passed: https://$CANARY/" >> "$GITHUB_STEP_SUMMARY"


      - name: Bootstrap first off-provider media backup when needed
        continue-on-error: true
        shell: bash
        run: |
          STATUS="$(curl --fail-with-body --silent --show-error \
            "https://$PRODUCTION_ALIAS/api/health/storage-backup")"

          CONFIGURED="$(printf '%s' "$STATUS" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{const x=JSON.parse(s);process.stdout.write(x?.configured===true?"1":"0")});
          ')"
          LAST_COMPLETED="$(printf '%s' "$STATUS" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{const x=JSON.parse(s);process.stdout.write(typeof x?.lastCompletedAt==="string"?x.lastCompletedAt:"")});
          ')"

          if [ "$CONFIGURED" != "1" ]; then
            echo "::warning::Off-provider media backup store is not configured; initial backup skipped."
            exit 0
          fi

          if [ -n "$LAST_COMPLETED" ]; then
            echo "Media backup already initialized at $LAST_COMPLETED; bootstrap skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set +e
          npx --yes vercel@60.1.3 crons run /api/cron/storage-backup \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee /tmp/storage-backup-cron.log
          CRON_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$CRON_EXIT" -ne 0 ]; then
            echo "::error::Unable to trigger the first media backup through Vercel Cron."
            exit "$CRON_EXIT"
          fi

          for attempt in $(seq 1 18); do
            STATUS="$(curl --fail-with-body --silent --show-error \
              "https://$PRODUCTION_ALIAS/api/health/storage-backup")"
            LAST_COMPLETED="$(printf '%s' "$STATUS" | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d);
              process.stdin.on("end",()=>{const x=JSON.parse(s);process.stdout.write(typeof x?.lastCompletedAt==="string"?x.lastCompletedAt:"")});
            ')"
            if [ -n "$LAST_COMPLETED" ]; then
              echo "First off-provider media backup completed at $LAST_COMPLETED." >> "$GITHUB_STEP_SUMMARY"
              printf '%s' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for first media backup ($attempt/18)..."
            sleep 5
          done

          echo "::error::Cron was triggered but no completed media backup became visible."
          exit 1
