name: Site Builder Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ajg-site-builder-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-builder
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_T1xBMzY6HJCAkUStrmkUgj60
      VERCEL_PROJECT_ID: prj_RUtVL1fXzOqY8dHetb6U2dp07Ygn
      VERCEL_SCOPE: ajg-saas-software
      VERCEL_CLI_VERSION: 59.6.0
    steps:
      - name: Require release token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::GitHub secret VERCEL_TOKEN is required for controlled production releases."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-builder/package-lock.json

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Run recovery archive tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Pull Vercel production configuration
        run: >
          npx --yes vercel@$VERCEL_CLI_VERSION pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"
          --scope="$VERCEL_SCOPE"

      - name: Build production artifact in GitHub Actions
        run: >
          npx --yes vercel@$VERCEL_CLI_VERSION build
          --prod
          --token="$VERCEL_TOKEN"
          --scope="$VERCEL_SCOPE"

      - name: Stage production deployment without assigning domains
        id: stage
        shell: bash
        run: |
          DEPLOYMENT_URL="$(npx --yes vercel@$VERCEL_CLI_VERSION deploy             --prebuilt             --prod             --skip-domain             --token="$VERCEL_TOKEN"             --scope="$VERCEL_SCOPE")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Staged deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test staged production artifact
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          curl --fail --silent --show-error             --retry 5 --retry-delay 2 --retry-all-errors             "$DEPLOYMENT_URL/api/health" > /tmp/health.json
          cat /tmp/health.json
          curl --fail --silent --show-error             --retry 5 --retry-delay 2 --retry-all-errors             "$DEPLOYMENT_URL/login" > /dev/null

      - name: Promote staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: >
          npx --yes vercel@$VERCEL_CLI_VERSION promote
          "$DEPLOYMENT_URL"
          --yes
          --token="$VERCEL_TOKEN"
          --scope="$VERCEL_SCOPE"

      - name: Verify live production health
        run: |
          curl --fail --silent --show-error             --retry 5 --retry-delay 2 --retry-all-errors             "https://ajg-site-builder.vercel.app/api/health"
          echo "Production release promoted from commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
