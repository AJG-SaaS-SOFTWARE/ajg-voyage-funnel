name: Site Builder Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/site-builder-production

permissions:
  contents: read

concurrency:
  group: ajg-site-builder-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/site-builder-production'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-builder
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_T1xBMzY6HJCAkUStrmkUgj60
      VERCEL_PROJECT_ID: prj_RUtVL1fXzOqY8dHetb6U2dp07Ygn
      VERCEL_SCOPE: ajg-saas-software
      VERCEL_CLI_VERSION: 59.20.0
      PRODUCTION_ALIAS: ajg-site-builder.vercel.app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::GitHub secret VERCEL_TOKEN is required for controlled production releases."
            exit 1
          fi

      - name: Validate CLI-compatible Vercel token
        shell: bash
        run: |
          if ! curl --fail --silent --show-error "https://api.vercel.com/v2/user" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json" > /tmp/vercel-user.json; then
            echo "::error::VERCEL_TOKEN cannot resolve the authenticated Vercel user. Create a Personal Access Token with Scope = Full Account and replace the GitHub Actions secret."
            exit 1
          fi
          echo "Vercel CLI identity preflight passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Require release branch to match main
        if: github.ref == 'refs/heads/release/site-builder-production'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Release branch must point to the current main commit."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-builder/package-lock.json

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Run recovery archive tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Capture current production rollback target
        id: previous
        shell: bash
        run: |
          RESPONSE="$(curl --fail --silent --show-error "https://api.vercel.com/v4/aliases/$PRODUCTION_ALIAS?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Accept: application/json")"
          PREVIOUS_ID="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);if(typeof x.deploymentId!=="string"||!x.deploymentId.startsWith("dpl_"))process.exit(2);process.stdout.write(x.deploymentId)})')"
          if [ -z "$PREVIOUS_ID" ]; then
            echo "::error::Unable to resolve the deployment currently serving $PRODUCTION_ALIAS."
            exit 1
          fi
          echo "deployment_id=$PREVIOUS_ID" >> "$GITHUB_OUTPUT"
          echo "Rollback target captured: $PREVIOUS_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Pull Vercel production configuration
        run: >
          npx --yes vercel@$VERCEL_CLI_VERSION pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"
          --scope="$VERCEL_SCOPE"

      - name: Build production artifact in GitHub Actions
        run: >
          npx --yes vercel@$VERCEL_CLI_VERSION build
          --prod
          --token="$VERCEL_TOKEN"
          --scope="$VERCEL_SCOPE"

      - name: Stage production deployment without assigning domains
        id: stage
        shell: bash
        run: |
          DEPLOYMENT_URL="$(npx --yes vercel@$VERCEL_CLI_VERSION deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Staged deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staged production artifact and revision
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: npm run verify:deployment -- --url="$DEPLOYMENT_URL" --sha="$GITHUB_SHA"

      - name: Promote staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: >
          npx --yes vercel@$VERCEL_CLI_VERSION promote
          "$DEPLOYMENT_URL"
          --yes
          --token="$VERCEL_TOKEN"
          --scope="$VERCEL_SCOPE"

      - name: Verify live production or rollback
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          if npm run verify:deployment -- --url="https://$PRODUCTION_ALIAS" --sha="$GITHUB_SHA"; then
            echo "Production release verified at commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Production revision/health verification failed after promotion. Rolling back to $PREVIOUS_DEPLOYMENT_ID."
          curl --fail --silent --show-error --request POST "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$PREVIOUS_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json"
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "https://$PRODUCTION_ALIAS/login" > /dev/null
          echo "Rollback requested to $PREVIOUS_DEPLOYMENT_ID after failed production revision/health verification." >> "$GITHUB_STEP_SUMMARY"
          exit 1
