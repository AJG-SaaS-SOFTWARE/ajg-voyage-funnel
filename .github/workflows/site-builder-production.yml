name: Site Builder Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/site-builder-production

permissions:
  contents: read

concurrency:
  group: ajg-site-builder-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/site-builder-production'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-builder
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_T1xBMzY6HJCAkUStrmkUgj60
      VERCEL_PROJECT_ID: prj_RUtVL1fXzOqY8dHetb6U2dp07Ygn
      PRODUCTION_ALIAS: ajg-site-builder.vercel.app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::GitHub secret VERCEL_TOKEN is required for controlled production releases."
            exit 1
          fi

      - name: Validate Vercel project API access
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json" > /tmp/vercel-project.json
          echo "Vercel project API preflight passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Require release branch to match main
        if: github.ref == 'refs/heads/release/site-builder-production'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Release branch must point to the current main commit."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-builder/package-lock.json

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Run recovery archive tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Capture current production rollback target
        id: previous
        shell: bash
        run: |
          RESPONSE="$(curl --fail --silent --show-error "https://api.vercel.com/v4/aliases/$PRODUCTION_ALIAS?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Accept: application/json")"
          PREVIOUS_ID="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);if(typeof x.deploymentId!=="string"||!x.deploymentId.startsWith("dpl_"))process.exit(2);process.stdout.write(x.deploymentId)})')"
          if [ -z "$PREVIOUS_ID" ]; then
            echo "::error::Unable to resolve the deployment currently serving $PRODUCTION_ALIAS."
            exit 1
          fi
          echo "deployment_id=$PREVIOUS_ID" >> "$GITHUB_OUTPUT"
          echo "Rollback target captured: $PREVIOUS_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Create staged deployment through Vercel REST API
        id: stage
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          BODY="$(node -e 'process.stdout.write(JSON.stringify({
            name:"ajg-site-builder",
            deploymentId:process.env.PREVIOUS_DEPLOYMENT_ID,
            withLatestCommit:true
          }))')"

          HTTP_CODE="$(curl --silent --show-error \
            --output /tmp/stage-create.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")"

          RESPONSE="$(cat /tmp/stage-create.json)"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Vercel deployment creation failed with HTTP $HTTP_CODE."
            printf '%s\n' "$RESPONSE"
            exit 1
          fi

          DEPLOYMENT_ID="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);if(typeof x.id!=="string"||!x.id.startsWith("dpl_")){console.error(s);process.exit(2)}process.stdout.write(x.id)})')"
          DEPLOYMENT_HOST="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);if(typeof x.url!=="string"){console.error(s);process.exit(2)}process.stdout.write(x.url)})')"

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "url=https://$DEPLOYMENT_HOST" >> "$GITHUB_OUTPUT"
          echo "Staged deployment created: $DEPLOYMENT_ID / https://$DEPLOYMENT_HOST" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for staged deployment to become READY
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.stage.outputs.deployment_id }}
        run: |
          for attempt in $(seq 1 60); do
            RESPONSE="$(curl --fail-with-body --silent --show-error \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Accept: application/json")"
            STATE="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.readyState||x.status||"UNKNOWN"))})')"
            echo "Deployment state: $STATE"
            if [ "$STATE" = "READY" ]; then
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              printf '%s\n' "$RESPONSE"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for staged Vercel deployment."
          exit 1

      - name: Verify staged deployment identity
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.stage.outputs.deployment_id }}
        run: |
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json")"

          node -e '
            const payload = JSON.parse(process.argv[1]);
            const expected = process.env.GITHUB_SHA;
            const actual = payload?.meta?.githubCommitSha || "";
            const state = payload?.readyState || payload?.status || "";
            if (state !== "READY") {
              console.error("Staged deployment is not READY:", state);
              process.exit(1);
            }
            if (!actual || actual !== expected) {
              console.error("Wrong staged commit:", { expected, actual });
              process.exit(1);
            }
          ' "$RESPONSE"

          echo "Protected staged deployment is READY at commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Promote staged deployment through Vercel REST API
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.stage.outputs.deployment_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json"
          echo "Promotion requested for $DEPLOYMENT_ID." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live production or rollback
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          for attempt in $(seq 1 8); do
            if npm run verify:deployment -- --url="https://$PRODUCTION_ALIAS" --sha="$GITHUB_SHA"; then
              echo "Production release verified at commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Production verification attempt $attempt/8 did not pass yet."
            sleep 5
          done

          echo "::error::Production revision/health verification failed after promotion. Rolling back to $PREVIOUS_DEPLOYMENT_ID."
          curl --fail-with-body --silent --show-error --request POST \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$PREVIOUS_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json"
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "https://$PRODUCTION_ALIAS/login" > /dev/null
          echo "Rollback requested to $PREVIOUS_DEPLOYMENT_ID after failed production revision/health verification." >> "$GITHUB_STEP_SUMMARY"
          exit 1
