name: ELTARA FlatCompat Lock Refresh

on:
  push:
    branches:
      - feat/eltara-eslint-baseline
    paths:
      - ".github/workflows/eltara-flatcompat-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-builder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/eltara-eslint-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-builder/package-lock.json
      - name: Refresh direct FlatCompat lock metadata
        run: npm install --save-dev --save-exact @eslint/eslintrc@3.3.7
      - name: Verify dependency tree
        run: npm ls @eslint/eslintrc eslint eslint-config-next
      - name: Commit lock metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package metadata changes."
            exit 0
          fi
          git config user.name "AJG Baseline Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "ELTARA: refresh FlatCompat lock metadata"
          git push origin HEAD:feat/eltara-eslint-baseline
