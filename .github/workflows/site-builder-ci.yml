name: ELTARA CI

concurrency:
  group: eltara-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - saas-site-builder-prototype
      - brand/eltara
    paths:
      - "site-builder/**"
      - ".github/workflows/site-builder-ci.yml"
      - ".github/workflows/site-builder-production.yml"
  pull_request:
    paths:
      - "site-builder/**"
      - ".github/workflows/site-builder-ci.yml"
      - ".github/workflows/site-builder-production.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-builder
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_PUBLISHED_ROOT_DOMAIN: eltara.ajgsolutionsgroup.com
      NEXT_PUBLIC_LEGACY_PUBLISHED_ROOT_DOMAINS: voyage.ajgsolutionsgroup.com
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-builder/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node --check scripts/verify-deployment.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:smoke
